# 배포물 빌드 (v1.0 10단계 → v2)
#
# ## 왜 잡을 나누는가
#
# 정적 프론트와 서버 번들은 **OS를 안 탄다** — 둘 다 JS(서버의 DB는 PGlite WASM)다.
# 우분투에서 한 번만 만들어 넘긴다. 그러면 OS별 러너는 **electron-builder만** 하면 된다:
# Next 빌드를 git bash에서 돌리는 게 제일 잘 깨지는 지점이라 아예 안 시킨다.
#
# v2: 자바 시절의 그래들 테스트·bootJar·번들 JRE(jlink) 단계가 통째로 사라졌다.
#
# ## 트리거가 둘이다
#
#   수동(workflow_dispatch)  빌드해서 **아티팩트로만** 남긴다. 릴리스를 안 만든다
#   태그(v*)                 위와 같이 만들고 **초안 릴리스**에 붙인다. 공개는 사람이 누른다
name: 배포물 빌드

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# 기본은 읽기만. 쓰기는 릴리스를 만드는 잡 하나에만 준다 — 빌드 잡은 의존성 설치 스크립트를 돌린다.
# 액션은 태그 대신 커밋 SHA로 고정한다(태그는 옮겨질 수 있다). 옆 주석의 태그는 사람이 읽으라고 둔다
permissions:
  contents: read

jobs:
  bundle:
    name: 프론트 + 서버 번들 (OS 무관)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (= v4.4.0)
        with:
          # 토큰을 .git/config에 남기지 않는다 — 뒤 단계(npm 설치 스크립트 등)가 집어 갈 수 없게
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (= v4.4.0)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json

      # ⚠️ **태그와 버전이 같아야 한다.** electron-builder는 태그가 아니라 package.json 버전으로 파일 이름을 짓는다 —
      # v2.x 태그에 `STARLOG-Setup-1.1.3.exe`가 붙어 나갈 뻔했다. 본문도 그 태그의 것이 있어야 한다
      - name: 태그 · 버전 · 릴리스 노트
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="v$(node -p "require('./desktop/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 desktop/package.json 버전($version)이 다릅니다"; exit 1
          fi
          test -s ".github/release-notes/${GITHUB_REF_NAME}.md" \
            || { echo "::error::.github/release-notes/${GITHUB_REF_NAME}.md가 없습니다"; exit 1; }

      # 새 앱 모듈을 electron-builder.yml이 안 싣는지 — 패키지에서만 기동하자마자 죽는다
      - name: 패키지 파일 목록
        run: node tools/check-package.js

      - name: 의존성
        run: |
          npm ci --prefix frontend
          npm ci --prefix server

      # ⚠️ **검사를 여기서 돌린다.** 안 돌리고 넘어가면 아무도 못 잡는다
      - name: 서버 타입 검사 · 테스트
        working-directory: server
        run: |
          npx tsx scripts/gen-migrations.ts
          npx tsc --noEmit -p .
          npx vitest run --passWithNoTests

      - name: 정적 빌드 + 서버 번들
        run: ./tools/build-desktop.sh

      # ⚠️ 둘 다 gitignore라 체크아웃만으로는 절대 안 생긴다
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (= v4.6.2)
        with:
          name: bundle
          path: |
            desktop/web
            desktop/server
          retention-days: 7

  package:
    name: ${{ matrix.label }}
    needs: bundle
    # 한쪽이 깨져도 다른 쪽 결과는 받아본다
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # 애플 실리콘
            args: "--mac"
            label: "macOS (arm64)"
          - os: windows-latest
            args: "--win"
            label: "Windows (x64)"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (= v4.4.0)
        with:
          # 토큰을 .git/config에 남기지 않는다 — 뒤 단계(npm 설치 스크립트 등)가 집어 갈 수 없게
          persist-credentials: false

      # 받은 것을 저장소 구조 그대로 되돌려 놓는다
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 (= v4.3.0)
        with:
          name: bundle
          path: desktop

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (= v4.4.0)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 배포물
        shell: bash
        working-directory: desktop
        run: |
          npm ci
          # --publish never: electron-builder가 스스로 깃헙에 올리려 들지 않게 한다.
          # 올리는 건 아래 release 잡이 gh로 한다
          npx electron-builder ${{ matrix.args }} --publish never

      # 실제로 묶인 asar를 연다 — require 그래프가 다 들어갔고 서버·화면·PGlite가 asar 밖에 풀렸나
      - name: 묶인 앱 점검
        shell: bash
        run: |
          asar=$(find desktop/dist -name app.asar -path '*esources*' | head -n 1)
          test -n "$asar" || { echo "::error::app.asar를 찾지 못했습니다"; exit 1; }
          node tools/check-package.js --asar "$asar"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (= v4.6.2)
        with:
          name: dist-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          retention-days: 7

  release:
    name: 초안 릴리스
    # 태그로 들어왔을 때만. 수동 실행은 아티팩트까지가 끝이다
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    # gh release create가 쓴다
    permissions:
      contents: write
    steps:
      # 릴리스 본문 파일(.github/release-notes/<태그>.md)을 읽어야 하므로 체크아웃한다
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (= v4.4.0)
        with:
          # 토큰을 .git/config에 남기지 않는다 — 뒤 단계(npm 설치 스크립트 등)가 집어 갈 수 없게
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 (= v4.3.0)
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: 초안으로 만든다
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # ⚠️ **--draft다.** 만들어만 놓고 공개는 사람이 누른다.
        # 서명이 없어서 첫 실행에 경고가 뜨는 앱이라, 안내문을 확인하고 내보내는 게 맞다
        # 릴리스 본문은 태그마다 `.github/release-notes/<태그>.md`에 손으로 쓴다 — 한 파일을 덮어 쓰면
        # 지난 노트가 새 태그에 그대로 붙어 나간다(1.1.3 노트가 남아 있었다).
        # `--generate-notes`는 커밋 제목을 나열할 뿐이라 **읽는 사람 기준의 글이 안 된다**
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --draft \
            --title "STARLOG ${GITHUB_REF_NAME}" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md"
