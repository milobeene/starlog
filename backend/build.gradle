plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.milobeene'
version = '1.0.0'

/*
 * jar 이름을 버전에서 떼어낸다 (O-3). Render의 시작 명령이 파일 이름을 그대로 적는데,
 * 기본값은 starlog-<version>.jar라 version을 올리는 순간 배포가 조용히 죽는다.
 * 배포처 설정을 손대지 않고 버전을 올릴 수 있어야 한다
 */
tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 스키마 주인 교체 (O-1). 부트 4는 자동설정이 모듈별로 쪼개져서 flyway-core만으론 안 돈다 (h2console과 같은 패턴).
	// H2 지원은 내장, PostgreSQL은 별도 모듈이 필요하다 (O-3)
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	// RestClient 자동 설정(RestClient.Builder 빈). 부트 4에서 HTTP 클라이언트가 모듈로 분리돼
	// starter-webmvc만으로는 안 딸려온다 — 서버(webmvc)와 클라이언트(restclient)가 별개다
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	// 동적 쿼리 (L-1). 원본 com.querydsl은 5.1.0에서 멈췄고 Jakarta EE 11 대응이 불확실해
	// 활발히 유지되는 OpenFeign 포크를 쓴다. Boot 4 / Hibernate 7에서 도는 것을 스파이크로 확인했다
	implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.0'
	annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:2.0.0'
	// 커버 업로드(Phase 5). R2가 S3 호환이라 AWS SDK를 그대로 쓴다 —
	// 나중에 S3·MinIO로 옮겨도 엔드포인트 설정만 바뀐다.
	// S3Presigner도 이 아티팩트에 들어 있다 (v2에서는 별도 모듈이 아니다)
	implementation platform('software.amazon.awssdk:bom:2.30.16')
	implementation 'software.amazon.awssdk:s3'
	compileOnly 'org.projectlombok:lombok'
	/*
	 * H2 버전을 고정한다. 부트 BOM이 끌어오는 2.4.240에서 **check 제약이 INSERT를 잘못 막는다** —
	 * `insert ... values (..., default)` 형태에서 chk_playthrough_status가 유효한 값에도 터진다.
	 * (UPDATE는 정상, 2.3.232에서는 INSERT도 정상. 2026-08-25 확인)
	 *
	 * dev의 H2 TCP 서버도 2.3.232라 드라이버를 맞춰야 한다 —
	 * 예전에 같은 불일치로 Flyway 메타데이터 조회가 깨진 적이 있다 (O-1)
	 */
	runtimeOnly 'com.h2database:h2:2.3.232'
	// prod(Neon). dev는 계속 H2라 둘 다 클래스패스에 있고, 프로필이 URL로 가른다
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	/*
	 * 실 PostgreSQL 검증 (Testcontainers).
	 *
	 * **전면 전환이 아니라 PG 전용 결함만 덮는 몇 개 테스트용이다.** 나머지 400여 개는
	 * H2 인메모리로 그대로 돈다 — 전부 컨테이너로 돌리면 테스트 시간이 몇 배가 된다.
	 *
	 * 도입한 이유 — H2(MODE=PostgreSQL)가 원리적으로 못 잡는 부류가 실제로 새어나갔다:
	 *   · null 파라미터 타입 추론 (`lower(bytea)`, `could not determine data type`) — 관리자 검색 2곳이 500
	 *   · 인덱스 정렬 방향 (H2는 방언 기본값이 nulls last라 괴리가 안 드러난다)
	 *   · read-only 트랜잭션 강제 (PG는 25006으로 거부, H2는 통과)
	 * 셋 다 테스트 400개가 초록불인 채로 운영에서만 터졌다.
	 *
	 * 코어 아티팩트만 쓴다 — `org.testcontainers:postgresql` 모듈이 이 환경에서 해석되지 않아
	 * GenericContainer로 postgres 이미지를 직접 띄운다. 어차피 필요한 건 "JDBC URL 하나"라
	 * 전용 모듈의 편의 메서드가 없어도 손해가 없다
	 */
	testImplementation 'org.testcontainers:testcontainers'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
