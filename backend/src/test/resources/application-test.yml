# 테스트 전용 설정. main의 application.yml 위에 덮인다 (통째로 대체가 아니라 병합).
# dev용 H2 TCP 서버를 건드리지 않도록 인메모리로 분리 — ddl-auto: create가 매 부팅마다
# 테이블을 DROP하는데, DDL은 트랜잭션 롤백 대상이 아니라서 dev 데이터가 날아간다.
spring:
  datasource:
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1

# 배치는 테스트에서 절대 자동으로 돌면 안 된다 — 2월 30일은 오지 않는 날짜다.
# 배치 로직 자체는 스케줄러를 거치지 않고 메서드를 직접 불러 검증한다
app:
  cleanup:
    auth-token-cron: "0 0 0 30 2 *"
    audit-log-cron: "0 0 0 30 2 *"
  withdrawal:
    purge-cron: "0 0 0 30 2 *"
