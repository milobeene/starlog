# 테스트 전용 설정. main의 application.yml 위에 덮인다 (통째로 대체가 아니라 병합).
# dev용 H2 TCP 서버를 건드리지 않도록 인메모리로 분리 — ddl-auto: create가 매 부팅마다
# 테이블을 DROP하는데, DDL은 트랜잭션 롤백 대상이 아니라서 dev 데이터가 날아간다.
spring:
  datasource:
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1

  # 일반 테스트는 종전대로 엔티티 → 스키마 자동 생성. 마이그레이션과 엔티티의 일치는
  # FlywayMigrationTest 하나가 전담한다 — 여기서 Flyway를 돌리면 383개가 전부 느려진다
  flyway:
    enabled: false

  # Flyway를 껐으니 세션 테이블을 만들 주체가 없다 → 여기서만 Spring Session에게 맡긴다.
  # embedded = 인메모리 H2일 때만 제 스크립트를 돌린다 (운영 DB에는 절대 손대지 않는 기본값)
  session:
    jdbc:
      initialize-schema: embedded

  # 쿼리 수를 세기 위한 스위치 (L-3). QueryCountTest가 이걸로 N+1을 감시한다.
  # 통계 수집은 공짜가 아니라서 운영에서는 켜지 않는다
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        generate_statistics: true

app:
  # 이메일 가입 제한을 푼다 — 테스트는 무작위 이메일로 회원을 만든다.
  # 제한이 걸린 동작 자체는 SignupRestrictionTest가 프로퍼티를 켜서 따로 검증한다
  signup:
    email-allowlist:
    # 테스트는 회원을 직접 만들어 바로 로그인한다. 승인제가 켜진 동작은
    # SignupRestrictionTest가 프로퍼티를 켜서 따로 검증한다
    require-approval: false

  # 배치는 테스트에서 절대 자동으로 돌면 안 된다 — 2월 30일은 오지 않는 날짜다.
  # 배치 로직 자체는 스케줄러를 거치지 않고 메서드를 직접 불러 검증한다
  cleanup:
    auth-token-cron: "0 0 0 30 2 *"
    audit-log-cron: "0 0 0 30 2 *"
  withdrawal:
    purge-cron: "0 0 0 30 2 *"

  # 테스트는 가짜 GameCatalogClient를 쓰므로 실제 호출이 없다.
  # 그래도 자격증명을 채워두는 건, 혹시 진짜 클라이언트가 타더라도
  # "자격증명 없음"이 아니라 진짜 실패 이유가 드러나게 하기 위해서다.
  # min-call-interval이 0인 이유 — 테스트에 260ms짜리 sleep이 끼면 안 된다
  igdb:
    client-id: test-client-id
    client-secret: test-client-secret
    min-call-interval: 0s
