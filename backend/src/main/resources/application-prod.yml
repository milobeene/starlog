# 배포 환경 (O-3). 자격증명은 전부 환경변수로만 들어온다 — 이 파일은 커밋된다.
#
# dev와 갈리는 지점은 셋뿐이다: 접속 대상(Neon), 시드 없음(DataInitializer가 @Profile("dev")),
# SQL 로그 없음. 스키마는 dev와 같은 Flyway 마이그레이션이 만든다.
spring:
  datasource:
    # Neon 대시보드의 JDBC 연결 문자열. sslmode=require가 필수다
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    # 커넥션 풀 (O-5). 기본 10은 무료 티어에 과하다 — Neon 무료는 유휴 시 컴퓨트를 재우는데,
    # 붙잡고 있는 커넥션이 많을수록 깨어 있는 시간이 길어져 무료 한도를 먼저 먹는다.
    # 지인 몇 명 규모에서 5면 Render 단일 인스턴스의 톰캣 스레드가 몰려도 남는다.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      # Neon이 유휴 커넥션을 끊기 전에 우리가 먼저 버린다. 남겨두면 죽은 커넥션을
      # 빌려 쓰다 첫 쿼리에서 터진다 — 그 예외는 스택만 봐서는 원인을 못 찾는다
      idle-timeout: 60000        # 1분
      max-lifetime: 300000       # 5분
      # 기본 30초는 콜드 스타트(Neon이 깨는 데 몇 초)에서 넉넉하지만,
      # 못 얻으면 빨리 502로 끊는 편이 낫다 — 사용자는 이유 없이 기다리는 걸 제일 싫어한다
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    open-in-view: false

  h2:
    console:
      enabled: false

logging:
  level:
    org.hibernate.SQL: warn
