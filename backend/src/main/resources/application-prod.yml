# 배포 환경 (O-3). 자격증명은 전부 환경변수로만 들어온다 — 이 파일은 커밋된다.
#
# dev와 갈리는 지점은 셋뿐이다: 접속 대상(Neon), 시드 없음(DataInitializer가 @Profile("dev")),
# SQL 로그 없음. 스키마는 dev와 같은 Flyway 마이그레이션이 만든다.
spring:
  datasource:
    # Neon 대시보드의 JDBC 연결 문자열. sslmode=require가 필수다
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    # 커넥션 풀 (O-5). 기본 10은 무료 티어에 과하다 — Neon 무료는 유휴 시 컴퓨트를 재우는데,
    # 붙잡고 있는 커넥션이 많을수록 깨어 있는 시간이 길어져 무료 한도를 먼저 먹는다.
    # 지인 몇 명 규모에서 5면 Render 단일 인스턴스의 톰캣 스레드가 몰려도 남는다.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      # Neon이 유휴 커넥션을 끊기 전에 우리가 먼저 버린다. 남겨두면 죽은 커넥션을
      # 빌려 쓰다 첫 쿼리에서 터진다 — 그 예외는 스택만 봐서는 원인을 못 찾는다
      idle-timeout: 60000        # 1분
      max-lifetime: 300000       # 5분
      # 기본 30초는 콜드 스타트(Neon이 깨는 데 몇 초)에서 넉넉하지만,
      # 못 얻으면 빨리 502로 끊는 편이 낫다 — 사용자는 이유 없이 기다리는 걸 제일 싫어한다
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    open-in-view: false

  h2:
    console:
      enabled: false

  # 구글 로그인 (FR-AUTH-06~08). **여기 없으면 구글 로그인이 통째로 사라진다** —
  # SecurityConfig가 `clientRegistrations != null`일 때만 oauth2Login을 체인에 붙이므로,
  # 등록이 없으면 /oauth2/authorization/google이 아무 필터에도 안 걸려 401이 된다.
  # 지금까지 이 블록은 application-local.yml(git 미포함)에만 있어서 배포에 안 올라갔다.
  #
  # 기본값을 안 준다 — 없으면 기동이 "placeholder를 못 찾겠다"로 즉시 죽는다.
  # 가입이 구글 전용이라 이게 없는 배포는 아무도 못 들어오는 껍데기다. 조용히 뜨는 것보다 낫다
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

# **크로스 사이트 배포의 핵심 스위치** (O-3).
# 프론트는 *.vercel.app, 백엔드는 *.onrender.com — 등록 도메인이 달라 브라우저가
# "다른 사이트"로 본다. 기본값 Lax면 쿠키가 크로스 사이트 요청에 아예 안 실려서,
# CORS를 열어도 세션이 안 붙고 로그인 직후부터 계속 401이 난다.
#
# None은 Secure를 요구한다(스펙). 둘 다 HTTPS라 문제없다 — 하나라도 http면 쿠키가 통째로 버려진다.
# 도메인을 사서 api.example.com / example.com으로 합치면 Lax로 되돌릴 수 있다
server:
  # **Render는 TLS를 프록시에서 끊는다.** 톰캣이 보는 요청은 http라, 이게 없으면 구글에 보낼
  # redirect_uri가 http://starlog.onrender.com/... 로 생성돼 콘솔에 등록한 https 주소와
  # 안 맞아 redirect_uri_mismatch로 죽는다.
  # framework: 스프링이 X-Forwarded-* 헤더를 읽어 원래 스킴·호스트를 복원한다
  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        same-site: none
        secure: true
        http-only: true

logging:
  level:
    org.hibernate.SQL: warn
