# 배포 환경 (O-3). 자격증명은 전부 환경변수로만 들어온다 — 이 파일은 커밋된다.
#
# dev와 갈리는 지점은 셋뿐이다: 접속 대상(Neon), 시드 없음(DataInitializer가 @Profile("dev")),
# SQL 로그 없음. 스키마는 dev와 같은 Flyway 마이그레이션이 만든다.
spring:
  datasource:
    # Neon 대시보드의 JDBC 연결 문자열. sslmode=require가 필수다
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    open-in-view: false

  h2:
    console:
      enabled: false

logging:
  level:
    org.hibernate.SQL: warn
