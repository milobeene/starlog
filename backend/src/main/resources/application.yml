spring:
  # 프로필을 안 정하면 dev로 간주한다. 시드(DataInitializer)가 dev에서만 돌게 하기 위한 안전판 —
  # 배포(Phase 9)는 SPRING_PROFILES_ACTIVE=prod를 명시하므로 이 기본값이 적용되지 않는다
  profiles:
    default: dev

  datasource:
    url: jdbc:h2:tcp://localhost/~/dev-tools/h2-data/gamebacklog
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        # 컬렉션·프록시를 하나씩 초기화하지 않고 IN (?, ?, ...)으로 묶어 받는다.
        # 페이지 크기(최대 100)와 맞춰뒀다 — 항목 수가 늘어도 쿼리 개수는 그대로다
        default_batch_fetch_size: 100
#        type:
#          preferred_enum_jdbc_type: VARCHAR
    open-in-view: false

  h2:
    console:
      enabled: true

logging:
  level:
    org.hibernate.SQL: debug