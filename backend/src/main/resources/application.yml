spring:
  # 프로필을 안 정하면 dev로 간주한다. 시드(DataInitializer)가 dev에서만 돌게 하기 위한 안전판 —
  # 배포(Phase 9)는 SPRING_PROFILES_ACTIVE=prod를 명시하므로 이 기본값이 적용되지 않는다
  profiles:
    default: dev,local

  datasource:
    url: jdbc:h2:tcp://localhost/~/dev-tools/h2-data/gamebacklog
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        # 컬렉션·프록시를 하나씩 초기화하지 않고 IN (?, ?, ...)으로 묶어 받는다.
        # 페이지 크기(최대 100)와 맞춰뒀다 — 항목 수가 늘어도 쿼리 개수는 그대로다
        default_batch_fetch_size: 100
#        type:
#          preferred_enum_jdbc_type: VARCHAR
    open-in-view: false

  h2:
    console:
      enabled: true

# 배치 주기. 테스트에서는 절대 안 도는 값으로 덮는다 (application-test.yml)
app:
  # IGDB (J-7). 자격증명은 환경변수 또는 application-local.yml로만 들어온다.
  # ${VAR:} 는 "없으면 빈 문자열"이라 자격증명 없이도 기동한다 — 호출 시점에 502로 끊긴다.
  # 나머지 값의 기본값은 IgdbProperties의 compact 생성자가 들고 있다
  igdb:
    client-id: ${IGDB_CLIENT_ID:}
    client-secret: ${IGDB_CLIENT_SECRET:}
  cleanup:
    auth-token-cron: "0 30 4 * * *"      # 매일 04:30
    audit-log-cron: "0 0 5 * * *"        # 매일 05:00
  withdrawal:
    purge-cron: "0 0 3 * * *"            # 매일 03:00

logging:
  level:
    org.hibernate.SQL: debug
    # 필터 체인을 눈으로 보려면 아래를 켠다 (I-1~I-3에서 사용)
    # org.springframework.security: debug