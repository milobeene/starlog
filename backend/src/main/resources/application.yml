spring:
  # 프로필을 안 정하면 dev로 간주한다. 시드(DataInitializer)가 dev에서만 돌게 하기 위한 안전판 —
  # 배포(Phase 9)는 SPRING_PROFILES_ACTIVE=prod를 명시하므로 이 기본값이 적용되지 않는다
  profiles:
    default: dev,local

  datasource:
    # MODE=PostgreSQL: 마이그레이션 SQL 하나가 H2(dev)와 PostgreSQL(prod) 양쪽에서 돌게 한다
    url: jdbc:h2:tcp://localhost/~/dev-tools/h2-data/starlog;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # 스키마 주인은 Flyway. Hibernate는 기동 때 엔티티와 실제 스키마가 맞는지 대조만 한다
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # 컬렉션·프록시를 하나씩 초기화하지 않고 IN (?, ?, ...)으로 묶어 받는다.
        # 페이지 크기(최대 100)와 맞춰뒀다 — 항목 수가 늘어도 쿼리 개수는 그대로다
        default_batch_fetch_size: 100
#        type:
#          preferred_enum_jdbc_type: VARCHAR
    open-in-view: false

  h2:
    console:
      enabled: true

# 배치 주기. 테스트에서는 절대 안 도는 값으로 덮는다 (application-test.yml)
app:
  igdb:
    client-id: ${IGDB_CLIENT_ID:}
    client-secret: ${IGDB_CLIENT_SECRET:}

  # 회원당 일일 한도 (docs/capacity-planning.md §2-B). 최대 사용자 10명 기준.
  # WEB-ONLY — 로컬 앱(desktop 프로파일)에서는 NoOpQuotaGuard가 붙어 이 값이 안 쓰인다.
  # 지인이 늘거나 줄면 배포 없이 환경변수로 바꾼다
  quota:
    game-search: ${QUOTA_GAME_SEARCH:200}
    game-add: ${QUOTA_GAME_ADD:50}
    cover-upload: ${QUOTA_COVER_UPLOAD:20}
    cover-upload-megabytes: ${QUOTA_COVER_UPLOAD_MB:200}

  # 커버 스토리지 (Phase 5). R2가 기본이지만 S3 호환이면 뭐든 된다 —
  # MinIO로 로컬 검증할 때는 endpoint만 바꾼다.
  # 자격증명이 없으면 UnconfiguredFileStorage로 대체되어 기동은 되고 업로드만 502가 된다
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    bucket: ${STORAGE_BUCKET:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
  # 정리 배치 시각. ⚠️ **이것만으로는 사실상 안 돈다** — 무료 티어는 15분 무활동에 잠들어
  # 새벽에 깨어 있지 않다. 실제 정리는 StartupCleanup(기동 시 따라잡기)이 한다.
  # 아래 크론은 언젠가 상시 켜진 서버가 됐을 때를 위해 남겨둔다 (도커 TZ가 Asia/Seoul이다)
  cleanup:
    audit-log-cron: "0 0 5 * * *"        # 매일 05:00 KST
  withdrawal:
    purge-cron: "0 0 3 * * *"            # 매일 03:00 KST

logging:
  level:
    org.hibernate.SQL: debug
    # 필터 체인을 눈으로 보려면 아래를 켠다 (I-1~I-3에서 사용)
    # org.springframework.security: debug