spring:
  # 프로필을 안 정하면 dev로 간주한다. 시드(DataInitializer)가 dev에서만 돌게 하기 위한 안전판 —
  # 배포(Phase 9)는 SPRING_PROFILES_ACTIVE=prod를 명시하므로 이 기본값이 적용되지 않는다
  profiles:
    default: dev,local

  datasource:
    # MODE=PostgreSQL: 마이그레이션 SQL 하나가 H2(dev)와 PostgreSQL(prod) 양쪽에서 돌게 한다
    url: jdbc:h2:tcp://localhost/~/dev-tools/h2-data/starlog;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # 스키마 주인은 Flyway. Hibernate는 기동 때 엔티티와 실제 스키마가 맞는지 대조만 한다
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # 컬렉션·프록시를 하나씩 초기화하지 않고 IN (?, ?, ...)으로 묶어 받는다.
        # 페이지 크기(최대 100)와 맞춰뒀다 — 항목 수가 늘어도 쿼리 개수는 그대로다
        default_batch_fetch_size: 100
#        type:
#          preferred_enum_jdbc_type: VARCHAR
    open-in-view: false

  h2:
    console:
      enabled: true

  # 파일 업로드 한도 (v1.0 6·7단계).
  #
  # ⚠️ **기본값이 파일 1MB / 요청 10MB다.** 커버는 5MB, 스크린샷은 20MB까지 받기로 해놓고
  # 이걸 안 올려서 **실제 스크린샷이 서버에 닿기도 전에 잘렸다** — 4K 캡처는 예사로 2~8MB다.
  # `app.storage.max-*-bytes`가 진짜 검증이고, 여기는 그보다 넉넉해야 그 검증이 의미를 갖는다
  servlet:
    multipart:
      # 영상(200MB)보다 넉넉해야 우리 검증 메시지가 나갈 기회를 얻는다
      max-file-size: 250MB
      max-request-size: 260MB

# 배치 주기. 테스트에서는 절대 안 도는 값으로 덮는다 (application-test.yml)
app:
  igdb:
    client-id: ${IGDB_CLIENT_ID:}
    client-secret: ${IGDB_CLIENT_SECRET:}

  # 번역 키 (2026-08-28). IGDB와 같은 규칙이다 —
  # 입구의 연결 설정이 환경변수로 넣어주고, 앱 안에서 넣은 값(app_setting)이 있으면 그게 이긴다
  translate:
    api-key: ${TRANSLATE_API_KEY:}

  # 커버 스토리지 (Phase 5). R2가 기본이지만 S3 호환이면 뭐든 된다 —
  # MinIO로 로컬 검증할 때는 endpoint만 바꾼다.
  # 자격증명이 없으면 UnconfiguredFileStorage로 대체되어 기동은 되고 업로드만 502가 된다
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    bucket: ${STORAGE_BUCKET:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}

logging:
  level:
    org.hibernate.SQL: debug
    # 필터 체인을 눈으로 보려면 아래를 켠다 (I-1~I-3에서 사용)
    # org.springframework.security: debug

# 무엇을 스토리지에 올릴지 (v1.0 6·7단계). 일렉트론이 연결 설정에서 읽어 환경변수로 넘긴다.
# **기본은 둘 다 로컬** — 아무것도 설정 안 한 사람이 바로 쓸 수 있어야 한다.
# 데이터 루트도 일렉트론이 정한다. 안 넘어오면 MediaPaths가 임시 폴더로 떨어뜨린다(개발용)
starlog:
  data-root: ${STARLOG_DATA_ROOT:}
  media:
    use-storage-for-covers: ${STARLOG_MEDIA_USE_STORAGE_FOR_COVERS:false}
    use-storage-for-screenshots: ${STARLOG_MEDIA_USE_STORAGE_FOR_SCREENSHOTS:false}
