spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/dev-tools/h2-data/gamebacklog
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true

logging:
  level:
    org.hibernate.SQL: debug