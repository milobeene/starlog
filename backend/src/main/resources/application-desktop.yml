# 데스크탑 앱으로 뜰 때 (v1.0 5단계).
#
# **접속 대상은 여기 없다.** DB URL·사용자·비밀번호는 일렉트론이 실행할 때 인자와
# 환경변수로 주입한다 — 사용자가 고른 세이브파일이나 클라우드 연결이라
# 빌드 시점에 알 수 없다 (docs/v1.0-architecture.md §2·§7).
#
# ⚠️ **application.yml과 다른 값만 적는다.** 프로필 파일은 활성 순서대로 위에 쌓이므로,
# 같은 값을 여기 다시 적으면 그게 다른 프로필(예: test)의 설정까지 덮어쓴다.
# 실제로 ddl-auto를 중복해 적었다가 `desktop`+`test`로 도는 테스트가 깨졌다.
spring:
  datasource:
    # 커넥션 풀 (O-5). 한 사람이 한 창에서 쓰므로 기본 10은 물론 5도 많다.
    # 클라우드 모드에서 특히 중요하다 — Neon 같은 서버리스 PG는 유휴 커넥션을 끊는데,
    # 붙잡고 있는 게 많을수록 죽은 커넥션을 빌려 첫 쿼리에서 터질 확률이 올라간다
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 60000        # 1분
      max-lifetime: 300000       # 5분
      connection-timeout: 10000

  jpa:
    properties:
      hibernate:
        # 사용자 화면 뒤에서 도는 서버다. SQL을 예쁘게 찍어봐야 볼 사람이 없고 로그만 커진다
        format_sql: false

  h2:
    console:
      # 로컬 모드가 H2 파일이라 콘솔이 붙을 수는 있지만 사용자 앱에 열어둘 이유가 없다.
      # 세이브파일은 데이터 폴더에 있으니 직접 열어보면 된다
      enabled: false

logging:
  level:
    org.hibernate.SQL: warn

# 종료를 곱게 한다 (2026-08-28).
#
# ⚠️ **세이브파일이 H2 파일 그 자체라 "끝맺음"이 데이터의 일부다.** 톰캣이 처리 중인
# 요청을 자르고 죽으면 커넥션이 열린 채 사라지고, 그 상태로 파일이 남는다.
# graceful이면 SIGTERM을 받고 **하던 요청을 마친 뒤** 풀을 닫는다.
#
# 30초는 일렉트론이 기다려주는 시간보다 짧아야 한다 (main.js의 stopBackend).
# 길게 잡으면 일렉트론이 먼저 SIGKILL을 쏴서 이 설정이 무의미해진다
server:
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 20s
