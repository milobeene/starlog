# 배포물 만들기 (v1.0 10단계) — `npx electron-builder`
#
# ## 서명하지 않는다 (결정)
#
# 애플 개발자 프로그램은 연 $99, 윈도우 코드서명 인증서는 하드웨어 토큰이 필수라 더 비싸다.
# 습작이고 쓰는 사람이 정해져 있어서 **경고를 감수하고 안 하기로 했다.**
# 대신 README에 여는 법을 적는다 — 맥은 "손상되었기 때문에 열 수 없습니다"가 뜨는데
# 진짜 손상이 아니라 다운로드 딱지(`com.apple.quarantine`) 때문이다.
appId: com.milobeene.starlog
productName: STARLOG
copyright: © 2026 milobeene

directories:
  output: dist
  buildResources: build

# ⚠️ **화이트리스트다.** 안 적으면 안 들어간다.
# (`node_modules`의 운영 의존성 — PGlite — 는 electron-builder가 알아서 싣는다)
# 앱 모듈은 이름 대신 `*.js`로 싣는다 (2026-10-25) — 새 모듈을 여기 안 적으면 패키지에서만
# "Cannot find module"로 기동하자마자 죽었다(`csp.js`가 그럴 뻔했다). 맨 위 폴더의 .js는 전부 앱 코드다.
# `tools/check-package.js`가 require 그래프와 이 목록을 대조한다
files:
  - "*.js"
  - web/**/*
  - server/main.mjs
  - server/THIRD_PARTY_LICENSES.txt
  - package.json

# ⚠️ **asar 밖으로 꺼낸다** (v2). 서버는 `utilityProcess.fork`로 띄우는 실제 파일이어야 하고,
# PGlite는 wasm·확장 파일을 실제 경로로 읽는다. 정적 파일은 서버가 `fs`로 서빙한다.
# 자바 시절엔 jar·JRE를 extraResources로 실었는데 그 자리가 이것으로 바뀌었다
asarUnpack:
  - server/**
  - web/**
  - node_modules/@electric-sql/**

# 퓨즈 — 실행 파일 안의 스위치를 패키징 때 굽는다 (설정·코드로는 못 되돌린다).
# 서명이 없어서 누가 우리 실행 파일을 "그냥 Node"로 돌리거나(RunAsNode·NODE_OPTIONS·--inspect)
# asar를 바꿔치기해도 OS가 막아 주지 않는다 → 그 길을 실행 파일 쪽에서 닫는다.
# utilityProcess는 RunAsNode와 무관하다(일렉트론 자체 경로) — 서버 기동은 그대로 산다
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  # 앱 코드(main.js 등)는 app.asar에서만 읽는다. asarUnpack한 server·web·PGlite는 "앱 진입점"이 아니라 영향 없다
  onlyLoadAppFromAsar: true
  # app.asar 머리의 해시를 실행 파일에 심은 값과 대조한다. **풀어 둔 파일(asarUnpack)은 검사 밖이다** —
  # server/main.mjs는 이걸로 못 지킨다
  enableEmbeddedAsarIntegrityValidation: true
  # file:// 페이지는 안 쓴다 (창은 app://, 본 앱은 http://127.0.0.1)
  grantFileProtocolExtraPrivileges: false

mac:
  category: public.app-category.productivity
  # ⚠️ **애드혹 서명은 한다.** 개발자 인증서가 없다고 서명을 통째로 건너뛰면
  # electron-builder가 번들을 고친 뒤 다시 서명을 안 해서 **서명이 깨진 채로 남는다**
  # (`spctl`: "code has no resources but signature indicates they must be present").
  # 애플 실리콘은 서명 없는 바이너리를 아예 실행하지 않으므로 깨진 서명은 위험하다.
  # `-`는 애드혹 — 신원 증명은 없지만 **자기 자신과는 일관된** 서명이다
  identity: "-"
  # 공증(notarize)을 안 하므로 하드닝 런타임이 얻는 게 없다. 켠 채로 애드혹 서명하면
  # **라이브러리 검증에 걸려 실행이 막힐 수 있다** — electron-builder도 그렇게 경고한다
  hardenedRuntime: false
  target:
    - target: dmg
      # 애플 실리콘만 낸다. 자바 시절엔 JRE가 아키텍처별이라 유니버설이 100MB를 더 먹었다 —
      # v2 서버는 JS·WASM이라 그 이유는 사라졌다. 인텔 맥이 필요해지면 유니버설로 바꿔도 된다
      arch: [arm64]

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  # 설치 위치를 고를 수 있게 한다. 원클릭은 묻지도 않고 %LOCALAPPDATA%에 넣는다
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 기본값은 `STARLOG Setup 1.0.0.exe`다 — **공백이 들어간다.** 릴리스 URL에서
  # `%20`으로 바뀌어 링크를 손으로 쓰기 나빠진다
  artifactName: ${productName}-Setup-${version}.exe
