# 배포물 만들기 (v1.0 10단계) — `npx electron-builder`
#
# ## 서명하지 않는다 (결정)
#
# 애플 개발자 프로그램은 연 $99, 윈도우 코드서명 인증서는 하드웨어 토큰이 필수라 더 비싸다.
# 습작이고 쓰는 사람이 정해져 있어서 **경고를 감수하고 안 하기로 했다.**
# 대신 README에 여는 법을 적는다 — 맥은 "손상되었기 때문에 열 수 없습니다"가 뜨는데
# 진짜 손상이 아니라 다운로드 딱지(`com.apple.quarantine`) 때문이다.
appId: com.milobeene.starlog
productName: STARLOG
copyright: © 2026 milobeene

directories:
  output: dist
  buildResources: build

# ⚠️ **화이트리스트다.** 안 적으면 안 들어간다.
# `runtime/`과 jar은 여기가 아니라 extraResources로 간다 — asar 안에 들어가면
# 자바를 실행할 수 없다(asar은 실제 파일이 아니라 아카이브 안의 가상 경로다)
files:
  - main.js
  - preload.js
  - paths.js
  - settings.js
  - backup.js
  - saveName.js
  - web/**/*
  - package.json

# 앱 바깥(Contents/Resources)에 그대로 놓이는 것들. `paths.js`가 여기를 본다
extraResources:
  # 번들 JRE. tools/build-jre.sh를 **먼저** 돌려야 한다
  - from: runtime
    to: runtime
  # 백엔드. tools/build-desktop.sh가 만든다
  - from: ../backend/build/libs/app.jar
    to: app.jar

mac:
  category: public.app-category.productivity
  # ⚠️ **애드혹 서명은 한다.** 개발자 인증서가 없다고 서명을 통째로 건너뛰면
  # electron-builder가 번들을 고친 뒤 다시 서명을 안 해서 **서명이 깨진 채로 남는다**
  # (`spctl`: "code has no resources but signature indicates they must be present").
  # 애플 실리콘은 서명 없는 바이너리를 아예 실행하지 않으므로 깨진 서명은 위험하다.
  # `-`는 애드혹 — 신원 증명은 없지만 **자기 자신과는 일관된** 서명이다
  identity: "-"
  # 공증(notarize)을 안 하므로 하드닝 런타임이 얻는 게 없다. 켠 채로 애드혹 서명하면
  # **라이브러리 검증에 걸려 실행이 막힐 수 있다** — electron-builder도 그렇게 경고한다.
  # 번들 JRE의 dylib을 잔뜩 로드하는 구조라 위험을 안 질 이유가 없다
  hardenedRuntime: false
  target:
    - target: dmg
      # ⚠️ 유니버설로 안 만든다 — **JRE가 아키텍처별**이라 두 벌을 넣어야 하고
      # 그러면 100MB가 그냥 늘어난다. 애플 실리콘만 낸다
      arch: [arm64]

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  # 설치 위치를 고를 수 있게 한다. 원클릭은 묻지도 않고 %LOCALAPPDATA%에 넣는다
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 기본값은 `STARLOG Setup 1.0.0.exe`다 — **공백이 들어간다.** 릴리스 URL에서
  # `%20`으로 바뀌어 링크를 손으로 쓰기 나빠진다
  artifactName: ${productName}-Setup-${version}.exe
